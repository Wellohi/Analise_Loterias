[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "quina_analisys"
version = "0.0.1"
description = "Analise de dados de resultados anteriores da quina"
authors = [
  { name = "Wellohi" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "==3.11.9"


[tool.ruff]
line-length = 99
src = ["quina_analisys"]
include = ["pyproject.toml", "quina_analisys/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["quina_analisys"]
force-sort-within-sections = true

